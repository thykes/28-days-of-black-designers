columns:
  - width: 2/3
    sections:
      content:
        type: fields
        fields:
          # Hero Section
          hero_headline:
            label: Hero Headline
            type: textarea
            buttons: false
            size: small
          hero_subheadline:
             label: Hero Subheadline
             type: textarea
             buttons: false
             size: small

          # Mission Quote Section
          mission_quote:
            label: Mission Quote
            type: textarea
            size: medium
            help: The large quote displayed on the purple background.

          # Founder Section
          founder_section_heading:
            label: Founder Section Heading
            type: headline
            label: Founder Information
          founder_name:
            label: Founder Name
            type: text
            width: 1/2
          founder_role:
             label: Founder Role
             type: text
             width: 1/2
          founder_bio:
             label: Founder Bio
             type: writer
          founder_image:
             label: Founder Image
             type: files
             max: 1
             layout: cards
             image:
               cover: true
               ratio: 4/5

  - width: 1/3
    sections:
      meta:
        type: fields
        fields:
          founder_website:
            label: Founder Website
            type: url
            icon: globe
          founder_instagram:
             label: Founder Instagram
             type: url
             icon: instagram
          founder_twitter:
             label: Founder Twitter
             type: url
             icon: twitter
