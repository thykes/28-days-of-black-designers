title: Designer
options:
  status: true
fields:
  day:
    label: Day
    type: number
    width: 1/4
  role:
    label: Role
    type: text
    width: 1/2
  autopublish:
    label: Auto Publish Date/Time
    type: date
    time: true
    width: 1/4
  autounpublish:
    label: Auto Unpublish Date/Time
    type: date
    time: true
    width: 1/4
  location:
    label: Location
    type: text
    width: 1/2
  website:
    label: Website URL
    type: url
    width: 1/2
  linkedin:
    label: LinkedIn URL
    type: url
    width: 1/2
  twitter:
    label: Twitter URL
    type: url
    width: 1/2
  instagram:
    label: Instagram URL
    type: url
    width: 1/2
  bluesky:
    label: Bluesky URL
    type: url
    width: 1/2
  tags:
    label: Area of Expertise
    type: tags
  intro:
    label: Intro Text
    type: textarea
  text:
    label: Main Story
    type: textarea
    size: large
  interview:
    label: The Interview
    type: structure
    label: Interview & Quotes
    fields:
      type:
        label: Entry Type
