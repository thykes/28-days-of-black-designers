          type: qa
      answer:
        label: Answer
        type: textarea
        size: medium
        when:
          type: qa
      quote_text:
        label: Quote Text
        type: textarea
        size: large
        when:
          type: quote
      citation:
        label: Citation (Optional)
        type: text
        when:
          type: quote
  cover:
    type: files
    max: 1
    label: Cover Image
  selected_works:
    label: Selected Works
    type: files
    layout: cards
    image:
      cover: true
